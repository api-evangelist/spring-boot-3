specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Spring Boot 3
providerId: spring-boot-3
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Framework
  - Java
  - Spring Boot
  - Rate Limiting
description: Spring Boot 3 is a self-hosted application framework, not a hosted
  API. There is no provider-imposed rate limit on Spring Boot itself. Rate
  limiting is applied at the application layer using Spring Cloud Gateway,
  Bucket4j, Resilience4j, or upstream proxies, and is the responsibility of the
  team operating the deployed application.
sources:
  - https://spring.io/projects/spring-boot
  - https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/
notes: Self-hosted framework; rate limiting is implemented inside the deployed
  application.
responseCodes:
  throttled: 429
limits:
  - name: Application-Defined
    scope: application
    metric: varies
    limit: defined by the application built on Spring Boot
    notes: Spring Boot itself imposes no rate limits. Limits live in the
      application via filters, gateways, or middleware.
policies:
  - name: Self-Hosted Throttling
    description: Spring Boot applications typically implement rate limiting via
      Spring Cloud Gateway's RequestRateLimiter (Redis-backed), Bucket4j
      token-bucket filters, Resilience4j RateLimiter decorators, or an upstream
      reverse-proxy / API gateway.
  - name: Actuator Endpoints
    description: The Spring Boot Actuator endpoints (/actuator/*) are local
      management endpoints; access control should be enforced via Spring
      Security rather than rate limiting.
maintainers:
  - name: VMware Tanzu (Broadcom)
    email: spring-team@vmware.com
    url: https://spring.io/team
