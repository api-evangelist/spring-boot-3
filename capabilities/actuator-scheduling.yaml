naftiko: 1.0.0-alpha2
info:
  label: Spring Boot 3 Actuator API — Scheduling
  description: 'Spring Boot 3 Actuator API — Scheduling. 1 operations. Lead operation: Get Scheduled Tasks. Self-contained
    Naftiko capability covering one Spring Boot 3 business surface.'
  tags:
  - Spring Boot 3
  - Scheduling
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_BOOT_3_API_KEY: SPRING_BOOT_3_API_KEY
capability:
  consumes:
  - type: http
    namespace: actuator-scheduling
    baseUri: http://localhost:8080/actuator
    description: Spring Boot 3 Actuator API — Scheduling business capability. Self-contained, no shared references.
    resources:
    - name: scheduledtasks
      path: /scheduledtasks
      operations:
      - name: getscheduledtasks
        method: GET
        description: Get Scheduled Tasks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: actuator-scheduling-rest
    port: 8080
    description: REST adapter for Spring Boot 3 Actuator API — Scheduling. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/scheduledtasks
      name: scheduledtasks
      description: REST surface for scheduledtasks.
      operations:
      - method: GET
        name: getscheduledtasks
        description: Get Scheduled Tasks
        call: actuator-scheduling.getscheduledtasks
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: actuator-scheduling-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Boot 3 Actuator API — Scheduling. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-scheduled-tasks
      description: Get Scheduled Tasks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: actuator-scheduling.getscheduledtasks
      outputParameters:
      - type: object
        mapping: $.
