naftiko: "1.0.0-alpha1"

info:
  label: "Spring Boot 3 Actuator API"
  description: >-
    Spring Boot 3 production-ready monitoring and management endpoints.
    Provides health checks, Micrometer metrics, environment inspection,
    logger configuration, thread dumps, and scheduled task visibility.
  tags:
    - Spring Boot
    - Actuator
    - Monitoring
    - Observability
    - Management
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SPRING_BOOT_BASE_URL: SPRING_BOOT_BASE_URL

capability:
  consumes:
    - type: http
      namespace: spring-boot-actuator
      baseUri: "{{env.SPRING_BOOT_BASE_URL}}/actuator"
      description: "Spring Boot 3 Actuator management and monitoring endpoints"
      resources:
        - name: health
          path: /health
          description: "Application health status aggregated from all health indicators"
          operations:
            - name: get-health
              method: GET
              description: "Get overall application health status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-health-component
              method: GET
              description: "Get health status for a specific component"
              inputParameters:
                - name: component
                  in: path
                  type: string
                  required: true
                  description: "Component name (e.g., db, diskSpace, redis)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: info
          path: /info
          description: "Application metadata from InfoContributors"
          operations:
            - name: get-info
              method: GET
              description: "Get application build, git, and environment info"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: metrics
          path: /metrics
          description: "Micrometer application metrics"
          operations:
            - name: list-metrics
              method: GET
              description: "List all registered metric names"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-metric
              method: GET
              description: "Get measurements for a specific metric"
              inputParameters:
                - name: metricName
                  in: path
                  type: string
                  required: true
                  description: "Metric name (e.g., jvm.memory.used)"
                - name: tag
                  in: query
                  type: string
                  required: false
                  description: "Tag filter in name:value format"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: environment
          path: /env
          description: "Application environment properties"
          operations:
            - name: get-environment
              method: GET
              description: "Get all environment properties grouped by source"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-environment-property
              method: GET
              description: "Get value and origin of a specific property"
              inputParameters:
                - name: toMatch
                  in: path
                  type: string
                  required: true
                  description: "Property key to look up"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: loggers
          path: /loggers
          description: "Runtime logger level configuration"
          operations:
            - name: list-loggers
              method: GET
              description: "List all loggers with their configured and effective levels"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-logger
              method: GET
              description: "Get the configuration for a specific logger"
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
                  description: "Logger name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: set-logger-level
              method: POST
              description: "Set the log level for a logger at runtime"
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
                  description: "Logger name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  configuredLevel: "{{tools.level}}"

        - name: threaddump
          path: /threaddump
          description: "JVM thread dump for diagnostics"
          operations:
            - name: get-thread-dump
              method: GET
              description: "Get a snapshot of all live JVM threads"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: scheduledtasks
          path: /scheduledtasks
          description: "Scheduled task registry"
          operations:
            - name: get-scheduled-tasks
              method: GET
              description: "List all registered @Scheduled tasks"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: spring-boot-actuator-rest
      resources:
        - path: /v1/health
          name: health
          operations:
            - method: GET
              name: get-health
              description: "Get application health status"
              call: "spring-boot-actuator.get-health"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/metrics
          name: metrics
          operations:
            - method: GET
              name: list-metrics
              description: "List available metrics"
              call: "spring-boot-actuator.list-metrics"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/metrics/{metricName}
          name: metric-detail
          operations:
            - method: GET
              name: get-metric
              description: "Get metric measurements"
              call: "spring-boot-actuator.get-metric"
              with:
                metricName: "rest.metricName"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/loggers
          name: loggers
          operations:
            - method: GET
              name: list-loggers
              description: "List all loggers"
              call: "spring-boot-actuator.list-loggers"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/loggers/{name}
          name: logger-detail
          operations:
            - method: GET
              name: get-logger
              description: "Get logger configuration"
              call: "spring-boot-actuator.get-logger"
              with:
                name: "rest.name"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: set-logger-level
              description: "Set logger level"
              call: "spring-boot-actuator.set-logger-level"
              with:
                name: "rest.name"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: spring-boot-actuator-mcp
      transport: http
      tools:
        - name: get-health
          description: "Get overall Spring Boot application health status"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.get-health"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-component-health
          description: "Get health status for a specific component (db, redis, diskSpace, etc.)"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.get-health-component"
          with:
            component: "tools.component"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-app-info
          description: "Get application build, git commit, and environment info"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.get-info"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-metrics
          description: "List all available Micrometer metric names"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.list-metrics"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-metric
          description: "Get measurements for a Micrometer metric by name with optional tag filtering"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.get-metric"
          with:
            metricName: "tools.metricName"
            tag: "tools.tag"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-environment
          description: "Get all application environment properties organized by property source"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.get-environment"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-environment-property
          description: "Get the value and origin of a specific environment property key"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.get-environment-property"
          with:
            toMatch: "tools.propertyKey"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-loggers
          description: "List all loggers with their configured and effective log levels"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.list-loggers"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-logger
          description: "Get the log level configuration for a specific logger"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.get-logger"
          with:
            name: "tools.loggerName"
          outputParameters:
            - type: object
              mapping: "$."

        - name: set-logger-level
          description: "Set the log level for a specific logger at runtime (e.g., DEBUG, INFO, WARN)"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "spring-boot-actuator.set-logger-level"
          with:
            name: "tools.loggerName"
            level: "tools.level"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-thread-dump
          description: "Get a snapshot of all live JVM threads for diagnostics"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.get-thread-dump"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-scheduled-tasks
          description: "List all @Scheduled tasks registered in the Spring application context"
          hints:
            readOnly: true
            openWorld: true
          call: "spring-boot-actuator.get-scheduled-tasks"
          outputParameters:
            - type: object
              mapping: "$."
