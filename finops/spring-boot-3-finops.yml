meters:
  - name: tanzu_spring_support
    description: Tanzu Spring support subscription that covers Spring Boot.
      Billing basis is contractual; not publicly disclosed.
    unit: varies
    aggregation: sum
    dimensions:
      - support_tier
principles:
  - name: Visibility
    description: Use Spring Boot Actuator metrics exposed via Micrometer
      (Prometheus, Datadog, Dynatrace, Elastic) to attribute runtime cost to
      requests and tenants. The framework itself emits no billing telemetry.
  - name: Allocation
    description: Allocate Tanzu support fees to the platform team that contracts
      the subscription; allocate runtime spend per application using cloud-tag
      / Kubernetes namespace conventions and Boot's `info` and `metrics`
      endpoints.
  - name: Optimization
    description: Reduce cloud runtime cost with GraalVM native images, Spring
      Boot 3's AOT processing, and lazy initialization. Tune actuator scrape
      intervals to balance observability cost. Choose JVM heap and CDS image
      settings to fit the deployment shape.
  - name: Accountability
    description: Tanzu support cost owned by the platform team. Per-application
      compute and observability cost owned by the workload team operating the
      Spring Boot service.
notes: Open-source library; per-call FinOps applies to the runtime of the
  consuming application, not to Spring Boot itself.
