name: Spring Boot 3
description: >-
  Spring Boot 3 is the major release of the opinionated Spring application framework, now built on Spring Framework 6,
  requiring Java 17 baseline and Jakarta EE 10. It delivers native image support via GraalVM, improved observability
  with Micrometer tracing, and a modernized auto-configuration system. Spring Boot 3 simplifies the development of
  production-ready stand-alone Spring applications with embedded servers, health endpoints, and externalized
  configuration.
